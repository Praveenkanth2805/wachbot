<!DOCTYPE html>
<html>
<head>
    <title>ASC Chatbot - Local Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-lg mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">Test Chatbot</h1>
        <div id="chat" class="h-64 overflow-y-auto border p-4 mb-4 bg-gray-50">
            <div>Bot: Hello! Type a message.</div>
        </div>
        <form id="chatForm" hx-post="/bot/message" hx-target="#chat" hx-swap="beforeend" hx-on::after-request="document.getElementById('msgInput').value=''">
            <input type="text" name="message" id="msgInput" class="border rounded w-full p-2 mb-2" placeholder="Type your message...">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded w-full">Send</button>
        </form>
        <script>
            document.body.addEventListener('htmx:afterRequest', function(evt) {
                // scroll down
                document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
            });
        </script>
    </div>
</body>
</html>
