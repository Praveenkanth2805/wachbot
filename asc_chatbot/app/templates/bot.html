<!DOCTYPE html>
<html>
<head>
    <title>ASC Chatbot - Local Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-lg mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">Test Chatbot</h1>
        <div id="chat" class="h-64 overflow-y-auto border p-4 mb-4 bg-gray-50">
            <div class="bot-msg"><strong>Bot:</strong> Hello! Type a message.</div>
        </div>
        <form id="chatForm">
            <input type="text" name="message" id="msgInput" class="border rounded w-full p-2 mb-2" placeholder="Type your message..." required>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded w-full">Send</button>
        </form>
    </div>

    <script>
        document.getElementById('chatForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgInput = document.getElementById('msgInput');
            const message = msgInput.value.trim();
            if (!message) return;

            const chatDiv = document.getElementById('chat');
            // User message
            const userMsg = document.createElement('div');
            userMsg.innerHTML = `<strong>You:</strong> ${message}`;
            chatDiv.appendChild(userMsg);
            msgInput.value = '';

            const formData = new FormData();
            formData.append('message', message);
            const response = await fetch('/bot/message', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            // Container for bot reply
            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'bot-msg';

            // Add text
            if (data.reply) {
                const strong = document.createElement('strong');
                strong.textContent = 'Bot: ';
                botMsgDiv.appendChild(strong);
                const textNode = document.createTextNode(data.reply);
                botMsgDiv.appendChild(textNode);
            }

            // Add media
            if (data.media_url) {
                let mediaEl;
                const mime = data.media_type || '';
                if (mime.startsWith('image/')) {
                    mediaEl = document.createElement('img');
                    mediaEl.src = data.media_url;
                    mediaEl.className = 'max-w-full h-auto mt-2';
                } else if (mime.startsWith('video/')) {
                    mediaEl = document.createElement('video');
                    mediaEl.src = data.media_url;
                    mediaEl.controls = true;
                    mediaEl.className = 'max-w-full mt-2';
                } else if (mime.startsWith('audio/')) {
                    mediaEl = document.createElement('audio');
                    mediaEl.src = data.media_url;
                    mediaEl.controls = true;
                    mediaEl.className = 'w-full mt-2';
                } else if (mime === 'application/pdf') {
                    mediaEl = document.createElement('a');
                    mediaEl.href = data.media_url;
                    mediaEl.textContent = '📄 View PDF';
                    mediaEl.target = '_blank';
                    mediaEl.className = 'text-blue-600 underline mt-2 inline-block';
                } else {
                    mediaEl = document.createElement('a');
                    mediaEl.href = data.media_url;
                    mediaEl.textContent = `📎 Download file (${mime})`;
                    mediaEl.target = '_blank';
                    mediaEl.className = 'text-blue-600 underline mt-2 inline-block';
                }
                if (mediaEl) {
                    // If no text, add "Bot:" label
                    if (!data.reply) {
                        const label = document.createElement('strong');
                        label.textContent = 'Bot: ';
                        botMsgDiv.appendChild(label);
                    }
                    botMsgDiv.appendChild(document.createElement('br'));
                    botMsgDiv.appendChild(mediaEl);
                }
            }

            // Fallback if nothing
            if (!data.reply && !data.media_url) {
                botMsgDiv.innerHTML = `<strong>Bot:</strong> Sorry, no reply.`;
            }

            chatDiv.appendChild(botMsgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        });
    </script>
</body>
</html>
