{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Categories</h1>
<div class="bg-white p-6 rounded shadow mb-6">
    <form method="post" class="flex gap-4">
        <input type="text" name="name" placeholder="Category Name" class="flex-1 border rounded p-2" required>
        <input type="text" name="description" placeholder="Description" class="flex-1 border rounded p-2">
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">Add Category</button>
    </form>
</div>
<table class="min-w-full bg-white shadow rounded">
    <thead>
        <tr>
            <th class="py-2 px-4 border-b text-left">ID</th>
            <th class="py-2 px-4 border-b text-left">Name</th>
            <th class="py-2 px-4 border-b text-left">Description</th>
            <th class="py-2 px-4 border-b text-left">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for cat in categories %}
        <tr>
            <td class="py-2 px-4 border-b">{{ cat.id }}</td>
            <td class="py-2 px-4 border-b">{{ cat.name }}</td>
            <td class="py-2 px-4 border-b">{{ cat.description or '' }}</td>
            <td class="py-2 px-4 border-b">
                <a href="/admin/categories/{{ cat.id }}/delete" onclick="return confirm('Delete?')" class="text-red-600 hover:text-red-800">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
